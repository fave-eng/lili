name: 1 - Check Telegram notifications (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Lili recipient and bot access (read only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('config.js', 'utf8'), sandbox);
          const cfg = sandbox.window.APP_CONFIG;
          const studentId = cfg?.student?.id;
          const expectedChatId = String(cfg?.telegram?.expectedChatId ?? '');
          const rawTopicId = cfg?.telegram?.expectedTopicId;
          const expectedTopicId = rawTopicId === null || rawTopicId === undefined || rawTopicId === ''
            ? null : Number(rawTopicId);

          if (studentId !== 'lili') throw new Error('config.js: student.id must be lili');
          if (expectedChatId !== '-1003974197904') {
            throw new Error('config.js: unexpected Telegram group chat ID');
          }
          if (expectedTopicId !== null && (!Number.isSafeInteger(expectedTopicId) || expectedTopicId <= 0)) {
            throw new Error('config.js: Telegram topic ID must be a positive integer or null');
          }
          if (cfg?.features?.telegramNotifications !== true) {
            throw new Error('Telegram notifications are disabled in config.js');
          }
          if (!cfg?.supabase?.url || !cfg?.supabase?.anonKey) {
            throw new Error('Supabase URL or publishable/anon key is missing');
          }

          const url = `${cfg.supabase.url.replace(/\/+$/, '')}/functions/v1/notify-telegram`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              apikey: cfg.supabase.anonKey,
              authorization: `Bearer ${cfg.supabase.anonKey}`,
            },
            body: JSON.stringify({ kind: 'diagnostics_health', studentId }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(`Health check failed: ${JSON.stringify(data)}`);
          }

          const compatibleVersions = new Set([
            'multi-student-diagnostics-v1',
            'multi-student-diagnostics-v2',
          ]);
          if (!compatibleVersions.has(data.diagnosticVersion)) {
            throw new Error(`Incompatible diagnostics version: ${String(data.diagnosticVersion)}`);
          }
          if (data.recipient?.ok !== true || data.recipient?.enabled !== true || data.recipient?.source !== 'database') {
            throw new Error(`No active database recipient for ${studentId}: ${JSON.stringify(data.recipient)}`);
          }

          const actualTopicId = data.recipient.threadId === null || data.recipient.threadId === undefined
            ? null : Number(data.recipient.threadId);
          if (actualTopicId !== expectedTopicId) {
            throw new Error(`Telegram topic mismatch: expected ${String(expectedTopicId)}, received ${String(actualTopicId)}`);
          }
          if (data.telegram?.bot?.ok !== true || data.telegram?.chat?.ok !== true) {
            throw new Error('Telegram bot or target group is inaccessible');
          }

          console.log(`OK: ${studentId}; recipient from database; diagnostics ${data.diagnosticVersion}.`);
          console.log(expectedTopicId === null
            ? 'Telegram destination: group without a separate topic.'
            : `Telegram destination: group topic ${expectedTopicId}.`);
          console.log('Bot and group access confirmed. No Telegram message was sent.');
          console.log('The health endpoint does not expose the recipient chat ID; exact database chat ID is not independently verified here.');
          NODE
